name: Package Application with PyInstaller

on:
  push:
    branches:
      - main

jobs:
  build:
    # Warunek sprawdza, czy commit jest mergem i czy w jego wiadomości pojawia się nazwa gałęzi 'dev'
    if: contains(github.event.head_commit.message, 'Merge') && contains(github.event.head_commit.message, 'dev')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Application with PyInstaller
        run: |
          pyinstaller pyinstaller.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: HA_Battery_Monitor
          path: dist/HA Battery Monitor.exe