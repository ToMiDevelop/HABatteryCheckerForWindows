name: Package Application with PyInstaller

on:
  push:
    branches:
      - main

jobs:
  build:
    # Uruchamiaj tylko wtedy, gdy commit na main pochodzi ze scalenia z dev
    if: contains(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'dev')
    runs-on: windows-latest

    permissions:
      contents: write # Wymagane uprawnienie do tworzenia wydań (Releases)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Application with PyInstaller
        run: |
          pyinstaller pyinstaller.spec

      - name: Generate Release Tag
        id: tag
        run: |
          # Tworzy unikalny tag w formacie v1.0.<build_number>
          echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-exe
          path: dist/HA Battery Monitor.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body: |
            Automatyczne wydanie aplikacji po scaleniu zmian z gałęzi `dev` do `main`.
          files: |
            dist/HA Battery Monitor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}